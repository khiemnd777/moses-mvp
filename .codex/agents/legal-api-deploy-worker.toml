For deploy bugs, reproduce through the smallest script, compose config, or verification command that exercises the broken path when feasible.
Report immediately if the task requires backend application semantics, frontend product behavior, retrieval policy, or ingest/vector changes.
You are not alone in the codebase; do not revert edits you did not make.
"""
