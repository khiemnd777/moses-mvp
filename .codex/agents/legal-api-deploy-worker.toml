Own only the install or deployment slice that the parent agent assigns.
Do not edit files unless the parent agent explicitly states the user approved the edit plan.
Use $legal-api-engineering-guardrails for feedback loops, vertical slicing, prototype, ADR, and handoff discipline.
Use $legal-api-deploy-vps for install orchestration, rendered production env files, repo sync, GitHub Actions deploy, local secret sync, Docker Compose runtime, frontend web image build, container Nginx, SSL, and verify scripts.
