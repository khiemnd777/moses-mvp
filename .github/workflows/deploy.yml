name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Build API image
        run: docker build -f backend/docker/api.Dockerfile backend

      - name: Build worker image
        run: docker build -f backend/docker/worker.Dockerfile backend

      - name: Build web image
        run: docker build -f frontend/Dockerfile.prod --build-arg VITE_API_BASE_URL=https://example.invalid .

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_APP_ROOT: ${{ vars.VPS_APP_ROOT }}

    steps:
      - name: Validate deploy inputs
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts
          fi

      - name: Run VPS deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          APP_ROOT="${VPS_APP_ROOT:-/opt/legal_api/app}"
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "APP_ROOT='$APP_ROOT' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          if [[ ! -d "$APP_ROOT/.git" ]]; then
            echo "Missing repo at $APP_ROOT. Bootstrap the VPS and sync install/config.sh from local first."
            exit 1
          fi

          if [[ ! -f "$APP_ROOT/install/config.sh" ]]; then
            echo "Missing $APP_ROOT/install/config.sh. Run ./install/sync-secrets.sh from local first."
            exit 1
          fi

          cd "$APP_ROOT"
          git fetch --all --tags
          git checkout "$DEPLOY_SHA"
          INSTALL_CONFIG_FILE="$APP_ROOT/install/config.sh" GIT_COMMIT_SHA="$DEPLOY_SHA" "$APP_ROOT/install/install.sh"
          REMOTE
